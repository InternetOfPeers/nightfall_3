# Use this script for running up nightfall_3 client in 'developer' mode with local
# bindings.  See the readme for more information.
services:
  client_1:
    image: ghcr.io/eyblockchain/nightfall3-client:latest
    volumes:
      - type: bind
        source: ./volumes/build
        target: /app/build
    networks:
      - nightfall_network
    ports:
      - 8090:80
    depends_on:
      - worker_1
      - mongodb_client_1
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-localhost}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_HTTP_PAYLOAD_ENABLED: ${LOG_HTTP_PAYLOAD_ENABLED:-true}
      LOG_HTTP_FULL_DATA: ${LOG_HTTP_FULL_DATA:-false}
      BLOCKCHAIN_URL: ${BLOCKCHAIN_URL:-http://blockchain:7545}
      STATE_GENESIS_BLOCK: ${STATE_GENESIS_BLOCK:-0}
      BLOCKCHAIN_WS_HOST: ${BLOCKCHAIN_WS_HOST:-blockchain}
      BLOCKCHAIN_PORT: ${BLOCKCHAIN_PORT:-8546}
      CIRCOM_WORKER_HOST: worker_1
      MONGO_URL: ${CLIENT_MONGO_URL:-mongodb://mongodb_client_1:27017}
      CONTRACT_FILES_URL: ${CONTRACT_FILES_URL}
      LAUNCH_LOCAL: 1
      GAS_ESTIMATE_ENDPOINT: ${GAS_ESTIMATE_ENDPOINT}
    command: [ 'npm', 'run', 'dev' ]

  mongodb_client_1:
    image: mongo:4.4.1-bionic
    hostname: mongodb_client_1
    ports:
      - 27018:27017
    networks:
      - nightfall_network
    command: "--quiet --logpath /dev/null" # use this command to reduce log noise
    volumes:
      - type: volume
        source: mongodb_client_1
        target: /data/db

  worker_1:
    image: ghcr.io/eyblockchain/nightfall3-worker:latest
    volumes:
      - type: bind
        source: ./volumes/proving_files
        target: /app/output/
    networks:
      - nightfall_network
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_HTTP_PAYLOAD_ENABLED: ${LOG_HTTP_PAYLOAD_ENABLED:-true}
      LOG_HTTP_FULL_DATA: ${LOG_HTTP_FULL_DATA:-false}
      CIRCUIT_FILES_URL: ${CIRCUIT_FILES_URL}

volumes:
  mongodb_client_1:


networks:
  nightfall_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.238.0/24
          gateway: 172.16.238.1
